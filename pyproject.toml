[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lalo"
version = "0.0.0"
description = "Turn text and photos into printable block figures."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.scripts]
lalo = "lalo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
